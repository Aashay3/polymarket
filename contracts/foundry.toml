[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.ci]
fuzz_runs = 1024

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
amoy = "${POLYGON_AMOY_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }
polygon = { key = "${POLYGONSCAN_API_KEY}", chain = 137 }
